<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>S.I.M sarl</title>
    <script type="text/javascript">
      // GitHub Pages n'a pas de routage côté serveur : on encode l'URL
      // demandée dans une query string, on redirige vers index.html, et
      // index.html la décode pour laisser React Router prendre le relais.
      // pathSegmentsToKeep=1 car le site est servi sous /sim-site/ tant que
      // le domaine personnalisé n'est pas actif (voir vite.config.ts).
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>

    <script type="text/javascript">
      // Décode l'URL encodée par public/404.html (astuce GitHub Pages SPA)
      // et restaure la vraie URL avant que React Router ne démarre.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
